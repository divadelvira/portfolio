<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{cms.title}}</title>

    <!-- Primary Meta Tags -->
    <meta
      name="description"
      content="{{cms.description}}"
    />
    <meta
      name="keywords"
      content="{{cms.keywords}}"
    />
    <meta name="author" content="{{cms.author}}" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{cms.siteUrl}}" />
    <meta property="og:title" content="{{cms.socialTitle}}" />
    <meta
      property="og:description"
      content="{{cms.socialDescription}}"
    />
    <meta property="og:image" content="{{cms.socialImage}}" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{cms.siteUrl}}" />
    <meta property="twitter:title" content="{{cms.socialTitle}}" />
    <meta
      property="twitter:description"
      content="{{cms.socialDescription}}"
    />
    <meta
      property="twitter:image"
      content="{{cms.socialImage}}"
    />

    <link rel="preload" href="/fonts/lilita-one.ttf" as="font" type="font/ttf" crossorigin />
    <link
      rel="preload"
      href="/fonts/nunito-sans-regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="icon" href="{{cms.favicon}}" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
